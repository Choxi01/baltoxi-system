# En cada PR hacia main corre lint, typecheck y tests.
# No necesita variables de entorno ni secretos: ningún comando se conecta a Supabase.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
